name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masmax_test
          POSTGRES_PASSWORD: test-password-not-for-production
          POSTGRES_DB: masmax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masmax_test -d masmax_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://masmax_test:test-password-not-for-production@localhost:5432/masmax_test
      JWT_SECRET: ci-jwt-secret-at-least-24-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-24-characters
      MEDIA_SIGNING_SECRET: ci-media-secret-at-least-24-characters
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run env:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx prisma validate --schema apps/backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
      - run: npm run audit:production

  docker-smoke:
    runs-on: ubuntu-latest
    needs: validate
    env:
      POSTGRES_USER: masmax
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: masmax
      DATABASE_URL: postgresql://masmax:ci-postgres-password@postgres:5432/masmax
      JWT_SECRET: ci-jwt-secret-at-least-24-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-24-characters
      MEDIA_SIGNING_SECRET: ci-media-secret-at-least-24-characters
      ADMIN_EMAIL: admin@site.local
      ADMIN_PASSWORD: Admin123456
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8088/api/health/ready && break
            test "$attempt" -lt 30
            sleep 5
          done
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/series)" = "401"
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/movies)" = "401"
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/episodes/latest)" = "401"
      - if: always()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
