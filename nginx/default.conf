server {
  listen 80;
  server_name _;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=10s;
  client_max_body_size 32M;
  client_body_timeout 3600s;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /uploads/images/ {
    alias /app/uploads/images/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /uploads/videos/ { return 404; }

  location /uploads/hls/ { return 404; }

  location /protected-media/ {
    internal;
    alias /app/uploads/;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "private, no-store" always;
    sendfile on;
  }

  location ~ ^/api/admin/uploads/resumable(?:/|$) {
    client_max_body_size 64M;
    set $backend_upstream backend:3000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/admin/uploads/video {
    client_max_body_size 2048M;
    set $backend_upstream backend:3000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    set $backend_upstream backend:3000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ~ /\. { deny all; }
  location ~* \.(env|map|sql|prisma|ya?ml)$ { deny all; }

  location / {
    set $frontend_upstream frontend:8080;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
